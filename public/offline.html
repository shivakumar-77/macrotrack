<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MacroTrack</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f8f9ff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;font-family:-apple-system,sans-serif}
.icon{width:80px;height:80px;background:linear-gradient(135deg,#5146e5,#3730a3);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;color:#fff;margin-bottom:20px}
h1{font-size:22px;font-weight:700;color:#1e293b;margin-bottom:8px}
p{font-size:14px;color:#64748b;text-align:center;line-height:1.6;max-width:260px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6366f1;margin:20px 4px 0;animation:bounce 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
</style>
</head>
<body>
<img class="icon" src="/Kayven.PNG" alt="MacroTrack logo">
<h1>MacroTrack</h1>
<p>Loading your nutrition dashboard…</p>
<div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
</body>
</html>
